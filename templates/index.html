<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>
<body>

<div class="main-container">

    <div class="card">

        <h1>Customer Churn Prediction</h1>

        <p class="subtitle">
            Predict whether a telecom customer is likely to leave the company.
        </p>

        <form action="/predict" method="post">

            <div class="input-group">
                <label>Tenure (Months)</label>
                <input type="number" name="tenure" placeholder="Enter tenure" required>
            </div>

            <div class="input-group">
                <label>Monthly Charges</label>
                <input type="number" step="0.01" name="monthlycharges" placeholder="Enter monthly charges" required>
            </div>

            <div class="input-group">
                <label>Total Charges</label>
                <input type="number" step="0.01" name="totalcharges" placeholder="Enter total charges" required>
            </div>

            <button type="submit">Predict Churn</button>

        </form>

        {% if prediction_text %}
        <div class="result-box">
            <h2>{{ prediction_text }}</h2>
        </div>
        {% endif %}

    </div>

</div>

</body>
</html>
